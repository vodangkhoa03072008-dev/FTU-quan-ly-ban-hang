services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: cocart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocart_user
      POSTGRES_PASSWORD: cocart_password_2026
      POSTGRES_DB: cocart_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cocart_redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly yes

volumes:
  pgdata:
